name: Independent Workbench package qualification
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact already-reviewed product source commit
        required: true
        type: string
      artifact_run:
        description: Optional completed run whose exact frozen assets will be reused
        required: false
        default: ''
        type: string
      artifact_sha256:
        description: Required official whole-artifact SHA256 when reusing a run
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  independent-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          path: source
      - name: Build exact pinned source with private verified tools and explicit frozen packages
        if: inputs.artifact_run == ''
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          REVIEWED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $ErrorActionPreference='Stop'
          & ./driver/scripts/Invoke-IndependentWorkbenchBuild.ps1 -SourceRoot (Join-Path $env:GITHUB_WORKSPACE 'source') -SourceCommit $env:REVIEWED_SOURCE_COMMIT -OutputRoot (Join-Path $env:RUNNER_TEMP 'workbench-independent')
      - name: Reuse exact previously retained build assets without rebuilding
        if: inputs.artifact_run != ''
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.artifact_run }}
          ORIGINAL_ARCHIVE_SHA256: ${{ inputs.artifact_sha256 }}
          REVIEWED_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $ErrorActionPreference='Stop'
          & ./driver/scripts/Reuse-IndependentWorkbenchBuild.ps1 -RunId $env:ORIGINAL_RUN -SourceCommit $env:REVIEWED_SOURCE_COMMIT -ExpectedArchiveSha256 $env:ORIGINAL_ARCHIVE_SHA256 -OutputRoot (Join-Path $env:RUNNER_TEMP 'workbench-independent')
      - name: Qualify exact native assets in a fresh official Windows container without an SDK
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'workbench-independent'
          $guestInput=Join-Path $root 'guest-input'
          $guest=Join-Path $root 'guest-evidence'
          [void][IO.Directory]::CreateDirectory($guestInput)
          Copy-Item -LiteralPath (Join-Path $root 'transfer') -Destination $guestInput -Recurse
          Copy-Item -LiteralPath './driver/scripts/Test-IndependentWindowsNoSdk.ps1' -Destination $guestInput
          & docker version
          if($LASTEXITCODE -ne 0){throw 'Docker is unavailable; do not change the host.'}
          & docker pull mcr.microsoft.com/windows/servercore:ltsc2025
          if($LASTEXITCODE -ne 0){throw 'Official base image pull failed.'}
          $image=(& docker image inspect mcr.microsoft.com/windows/servercore:ltsc2025|ConvertFrom-Json)[0]
          if($LASTEXITCODE -ne 0 -or $image.Architecture -cne 'amd64' -or $image.Os -cne 'windows' -or $image.RepoDigests.Count -ne 1){throw 'Unexpected official Windows image identity.'}
          $digest=$image.RepoDigests[0]
          if($digest -cnotmatch '^mcr.microsoft.com/windows/servercore@sha256:[a-f0-9]{64}$'){throw 'Unpinned container image.'}
          @{image=$digest;imageId=$image.Id;osVersion=$image.OsVersion;architecture=$image.Architecture;runnerOs=[Environment]::OSVersion.VersionString;network='none';isolation='process';inputReadOnly=$true}|ConvertTo-Json|Set-Content (Join-Path $root 'guest-image.json') -Encoding utf8NoBOM
          $name='archsift-no-sdk-'+$env:GITHUB_RUN_ID
          try {
            & docker run --name $name --isolation process --network none --mount "type=bind,source=$guestInput,target=C:\input,readonly" $digest powershell.exe -NoProfile -NonInteractive -File C:\input\Test-IndependentWindowsNoSdk.ps1
            $code=$LASTEXITCODE
            & docker cp "${name}:C:/work" $guest
            if($LASTEXITCODE -ne 0){throw 'Guest evidence copy failed.'}
            if($code -ne 0){throw 'Independent no-SDK gate stopped; retain all evidence.'}
          } finally {
            & docker rm $name
            if($LASTEXITCODE -ne 0){Write-Warning 'Owned container cleanup failed; hosted VM teardown remains.'}
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-workbench-${{ inputs.source_commit }}
          path: |
            ${{ runner.temp }}/workbench-independent/transfer
            ${{ runner.temp }}/workbench-independent/*.json
            ${{ runner.temp }}/workbench-independent/*.log
            ${{ runner.temp }}/workbench-independent/guest-evidence
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
