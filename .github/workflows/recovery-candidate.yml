name: Unpublished recovery correction candidate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/nr06-correction-dotnet
        with:
          dotnet-version: |
            10.0.303
            10.0.402
      - name: Build hash-bound unpublished packages from clean source
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          DOTNET_CLI_HOME: ${{ runner.temp }}/nr06-correction-home
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/HostState.ps1
          $before=Get-ArchSiftHostHash
          $feed=Join-Path $env:RUNNER_TEMP 'nr06-correction-feed'
          try {
            & dotnet restore ArchSift.slnx --locked-mode --configfile NuGet.Config --source https://api.nuget.org/v3/index.json --packages $feed -p:NuGetAudit=false
            if($LASTEXITCODE -ne 0){throw 'Explicit CI prerequisite restore failed'}
            if((Get-ArchSiftHostHash) -cne $before){throw 'Host drift after prerequisite restore'}
            & ./scripts/Build-WorkspacePackages.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'nr06-correction-candidate') -LocalFeed $feed -DotnetPath (Get-Command dotnet).Source
          } finally {
            if((Get-ArchSiftHostHash) -cne $before){throw 'Host drift; preserve evidence, no repair'}
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unpublished-recovery-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nr06-correction-candidate/packages
            ${{ runner.temp }}/nr06-correction-candidate/*.json
            ${{ runner.temp }}/nr06-correction-candidate/*.log
          retention-days: 14
          if-no-files-found: error
