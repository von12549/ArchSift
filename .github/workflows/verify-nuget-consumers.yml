name: Published NuGet consumer acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned parsers without lifecycle scripts
        run: npm ci --prefix scripts/nuget-release --ignore-scripts --no-audit --no-fund
      - name: Exercise consumer evidence and workflow boundaries without product execution
        run: node --test scripts/nuget-consumers/consumer.test.mjs
  consumers:
    needs: safety
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, sdk: 10.0.100}
          - {os: windows-latest, sdk: 10.0.303}
          - {os: windows-latest, sdk: 10.0.402}
          - {os: ubuntu-latest, sdk: 10.0.100}
          - {os: ubuntu-latest, sdk: 10.0.303}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NR06_RELEASE_SWITCH: ${{ vars.ARCHSIFT_NUGET_PUBLISH_0110 }}
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/nr06-dotnet
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check credential-free context and closed repository switch
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/Assert-NR06HostedContext.ps1 -ReadRepositorySwitch
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            ${{ matrix.sdk }}
            10.0.402
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.os == 'windows-latest' && matrix.sdk == '10.0.303'
        with:
          dotnet-version: 9.0.314
      - name: Install pinned package archive parser without lifecycle scripts
        run: npm ci --prefix scripts/nuget-release --ignore-scripts --no-audit --no-fund
      - name: Qualify the public signed consumers outside the source checkout
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: ./scripts/Invoke-NR06HostedConsumers.ps1 -Sdk '${{ matrix.sdk }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nr06-${{ matrix.os }}-${{ matrix.sdk }}
          path: ${{ runner.temp }}/nr06-evidence
          if-no-files-found: error
          retention-days: 30
