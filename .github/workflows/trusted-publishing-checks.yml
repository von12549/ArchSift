name: Trusted Publishing activation safety checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned parsers without lifecycle scripts
        run: npm ci --prefix scripts/nuget-release --ignore-scripts --no-audit --no-fund
      - name: Reject unsafe workflows and exercise only synthetic release transactions
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/HostState.ps1
          $before = Get-ArchSiftHostHash
          try {
            & node ./scripts/Test-TrustedPublishingWorkflow.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Workflow boundary failed' }
            & node --test ./scripts/nuget-release/release.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic release safety cases failed' }
            & ./scripts/Test-NuGetReleasePreflightCases.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'trusted-publishing-tests')
          } finally {
            if ((Get-ArchSiftHostHash) -cne $before) { throw 'Host drift; no repair performed' }
          }
      - name: Verify original source CI read-only
        shell: pwsh -NoProfile -NonInteractive -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/Test-NuGetReleasePreflight.ps1 -CheckSourceCi
