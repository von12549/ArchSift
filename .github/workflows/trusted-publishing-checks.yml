name: Trusted Publishing preparation checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preparation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject unsafe workflow changes and exercise release preflight negatives
        shell: pwsh -NoProfile -NonInteractive -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          & node ./scripts/Test-TrustedPublishingWorkflow.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preparation workflow boundary failed' }
          & ./scripts/Test-NuGetReleasePreflightCases.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'trusted-publishing-tests')
